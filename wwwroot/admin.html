<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dari — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  body{padding:40px 20px;}
  .admin-wrap{max-width:520px;margin:0 auto;transition:max-width .2s;}
  .admin-wrap.wide{max-width:760px;}
  .code-big{font-family:var(--font-mono);font-size:48px;font-weight:600;letter-spacing:.15em;text-align:center;padding:24px;background:var(--accent-soft);color:var(--accent);border-radius:var(--radius-m);margin:18px 0;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  td,th{padding:8px 6px;text-align:left;border-bottom:1px solid var(--border);}
  .table-wrap{overflow-x:auto;}
</style>
</head>
<body>
  <div class="admin-wrap">
    <div class="brand" style="justify-content:center;margin-bottom:20px;"><div class="brand-mark">D</div><div class="brand-name">Dari Admin</div></div>
    <div id="root"></div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="admin.js"></script>

</html>

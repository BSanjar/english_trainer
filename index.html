<title>Lexi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F5F0;
  --surface:#FFFFFF;
  --surface-2:#EBEDE5;
  --surface-3:#EEF0E9;
  --ink:#1A211D;
  --ink-muted:#626D62;
  --ink-faint:#93998F;
  --border:#DCE0D5;
  --accent:#2E6F62;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCEAE5;
  --accent-2:#AE6A22;
  --accent-2-soft:#F2E3CC;
  --success:#3F8F5F;
  --success-soft:#DFF0E4;
  --danger:#C24B41;
  --danger-soft:#F8E2DF;
  --warn:#B78620;
  --warn-soft:#F3E9D1;
  --shadow:0 1px 2px rgba(26,33,29,.06),0 6px 20px -8px rgba(26,33,29,.12);
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:20px;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121613;
    --surface:#191F1B;
    --surface-2:#202722;
    --surface-3:#1B211D;
    --ink:#E9EDE6;
    --ink-muted:#9CA79A;
    --ink-faint:#647063;
    --border:#2A322C;
    --accent:#63B9A3;
    --accent-ink:#0B1512;
    --accent-soft:#1C332C;
    --accent-2:#E1AC6E;
    --accent-2-soft:#372B1B;
    --success:#72C08F;
    --success-soft:#1D3324;
    --danger:#E58B82;
    --danger-soft:#3A2320;
    --warn:#E7C077;
    --warn-soft:#362C1A;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px -10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#121613;
  --surface:#191F1B;
  --surface-2:#202722;
  --surface-3:#1B211D;
  --ink:#E9EDE6;
  --ink-muted:#9CA79A;
  --ink-faint:#647063;
  --border:#2A322C;
  --accent:#63B9A3;
  --accent-ink:#0B1512;
  --accent-soft:#1C332C;
  --accent-2:#E1AC6E;
  --accent-2-soft:#372B1B;
  --success:#72C08F;
  --success-soft:#1D3324;
  --danger:#E58B82;
  --danger-soft:#3A2320;
  --warn:#E7C077;
  --warn-soft:#362C1A;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);}
.app{display:flex;min-height:100vh;background:var(--bg);color:var(--ink);}
::selection{background:var(--accent-soft);color:var(--ink);}
button{font-family:inherit;}
a{color:inherit;}
h1,h2,h3{text-wrap:balance;margin:0;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

/* ---------- sidebar ---------- */
.sidebar{
  width:236px;flex:0 0 236px;background:var(--surface-3);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px;}
.brand-mark{
  width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:18px;flex:none;
}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:-.01em;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-s);
  color:var(--ink-muted);text-decoration:none;font-size:14.5px;font-weight:600;cursor:pointer;border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:var(--surface-2);color:var(--ink);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);}
.nav-item .ic{width:19px;height:19px;flex:none;}
.nav-badge{
  margin-left:auto;background:var(--accent-2);color:#fff;font-family:var(--font-mono);font-size:11px;font-weight:600;
  padding:1px 7px;border-radius:99px;min-width:18px;text-align:center;
}
.nav-spacer{flex:1;}
.sidebar-foot{padding:12px 10px 4px;font-size:12px;color:var(--ink-faint);border-top:1px solid var(--border);margin-top:8px;padding-top:14px;}
.sync-pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);flex:none;}
.sync-dot.on{background:var(--success);}
.sync-dot.busy{background:var(--warn);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.35;}}

/* ---------- mobile tab bar ---------- */
.tabbar{display:none;}

/* ---------- main ---------- */
.main{flex:1;min-width:0;}
.view{padding:34px 40px 80px;max-width:1180px;margin:0 auto;}
.view-narrow{max-width:760px;}
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap;}
.page-title{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-.01em;}
.page-sub{color:var(--ink-muted);font-size:14.5px;margin-top:4px;}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;
  padding:11px 18px;border-radius:99px;border:1px solid transparent;cursor:pointer;transition:transform .08s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.05);}
.btn-ghost{background:var(--surface-2);color:var(--ink);}
.btn-ghost:hover{background:var(--surface);border-color:var(--border);}
.btn-outline{background:transparent;border-color:var(--border);color:var(--ink);}
.btn-outline:hover{background:var(--surface-2);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-sm{padding:7px 13px;font-size:12.5px;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.01em;}
.pill-level-A1{background:var(--success-soft);color:var(--success);}
.pill-level-A2{background:var(--success-soft);color:var(--success);}
.pill-level-B1{background:var(--warn-soft);color:var(--warn);}
.pill-level-B2{background:var(--warn-soft);color:var(--warn);}
.pill-level-C1{background:var(--danger-soft);color:var(--danger);}
.pill-muted{background:var(--surface-2);color:var(--ink-muted);}
.pill-accent{background:var(--accent-soft);color:var(--accent);}
.tag{background:var(--surface-2);color:var(--ink-muted);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-muted);flex:none;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);}
.icon-btn.on{color:var(--accent-2);border-color:var(--accent-2-soft);background:var(--accent-2-soft);}
svg{display:block;}

/* ---------- dashboard ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
.stat-card{padding:18px 20px;display:flex;flex-direction:column;gap:6px;}
.stat-num{font-family:var(--font-mono);font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.stat-label{font-size:13px;color:var(--ink-muted);font-weight:600;}
.cta-row{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:26px;}
.cta-card{padding:24px 26px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;}
.cta-card.primary{background:var(--accent);color:var(--accent-ink);}
.cta-card.primary .cta-sub{color:color-mix(in srgb, var(--accent-ink) 75%, transparent);}
.cta-title{font-family:var(--font-display);font-size:22px;font-weight:600;}
.cta-sub{font-size:13.5px;color:var(--ink-muted);}
.cta-card.primary .btn-primary{background:var(--accent-ink);color:var(--accent);}
.cta-card .btn-outline{border-color:currentColor;}
.two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;}
.section-title{font-family:var(--font-display);font-size:17px;font-weight:600;margin-bottom:12px;}
.panel{padding:20px 22px;}
.level-row{display:flex;align-items:center;gap:12px;padding:9px 0;}
.level-row .lv-label{width:96px;flex:none;font-size:12.5px;font-weight:700;color:var(--ink-muted);}
.bar-track{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;background:var(--accent);}
.level-row .lv-count{width:64px;flex:none;text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);}
.chart-wrap{padding:20px 22px;}
.word-of-day{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
.wod-word{font-family:var(--font-display);font-size:26px;font-weight:600;}
.wod-ipa{font-family:var(--font-mono);font-size:13px;color:var(--ink-muted);margin-top:2px;}
.wod-ru{margin-top:10px;color:var(--accent-2);font-weight:700;font-size:15px;}
.wod-ex{margin-top:8px;font-size:13.5px;color:var(--ink-muted);line-height:1.5;}

/* ---------- session / flashcard ---------- */
.session-shell{max-width:640px;margin:0 auto;}
.session-top{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.session-top .bar-track{height:6px;}
.session-count{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-muted);flex:none;}
.flash{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);
  min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:44px 32px;gap:14px;box-shadow:var(--shadow);position:relative;
}
.flash-badges{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start;}
.flash-word{font-family:var(--font-display);font-size:44px;font-weight:600;letter-spacing:-.01em;line-height:1.1;}
.flash-ipa{font-family:var(--font-mono);color:var(--ink-muted);font-size:15px;}
.flash-ru{font-family:var(--font-display);font-size:26px;color:var(--accent-2);font-weight:600;margin-top:4px;}
.flash-ex{max-width:440px;margin-top:14px;font-size:15px;line-height:1.55;color:var(--ink-muted);}
.flash-ex mark{background:var(--accent-soft);color:var(--accent);padding:0 3px;border-radius:4px;font-weight:700;}
.flash-ex-ru{max-width:440px;margin-top:6px;font-size:13.5px;line-height:1.5;color:var(--ink-faint);}
.flash-hint{position:absolute;bottom:16px;font-size:12px;color:var(--ink-faint);}
.flash-badges .right-badges{display:flex;gap:8px;align-items:center;}
.grade-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px;}
.grade-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px;border-radius:var(--radius-s);
  border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:700;font-size:13.5px;
}
.grade-btn small{font-family:var(--font-mono);font-weight:500;font-size:11px;color:var(--ink-faint);}
.grade-btn.again{color:var(--danger);}
.grade-btn.hard{color:var(--warn);}
.grade-btn.good{color:var(--accent);}
.grade-btn.easy{color:var(--success);}
.grade-btn:hover{background:var(--surface-2);}
.reveal-row{display:flex;justify-content:center;margin-top:20px;}
.new-badge{position:absolute;top:18px;left:20px;}
.session-empty{text-align:center;padding:70px 20px;color:var(--ink-muted);}
.session-empty .big-ic{font-size:44px;margin-bottom:10px;}

/* ---------- bank ---------- */
.bank-controls{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search-input{
  flex:1;min-width:220px;padding:11px 16px;border-radius:99px;border:1px solid var(--border);background:var(--surface);
  color:var(--ink);font-size:14px;
}
.search-input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.chip-select{padding:10px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;}
.bank-table{width:100%;border-collapse:collapse;}
.bank-row{cursor:pointer;border-bottom:1px solid var(--border);}
.bank-row:hover{background:var(--surface-2);}
.bank-row td{padding:11px 10px;font-size:14px;vertical-align:middle;}
.bank-word{font-weight:700;font-family:var(--font-display);font-size:16px;}
.bank-ru{color:var(--ink-muted);}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.status-new .status-dot{background:var(--ink-faint);}
.status-learning .status-dot{background:var(--warn);}
.status-review .status-dot{background:var(--accent);}
.status-mastered .status-dot{background:var(--success);}
.bank-count{color:var(--ink-muted);font-size:13px;margin:10px 0 20px;}
.star-btn{background:none;border:none;cursor:pointer;color:var(--ink-faint);padding:4px;}
.star-btn.on{color:var(--accent-2);}
.load-more{display:flex;justify-content:center;margin-top:18px;}

/* ---------- word detail modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,14,11,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--surface);border-radius:var(--radius-l);max-width:480px;width:100%;padding:30px;box-shadow:var(--shadow);max-height:88vh;overflow-y:auto;}
.modal-close{position:absolute;}
.modal-top{display:flex;justify-content:space-between;align-items:flex-start;}
.modal-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}
.modal-meta{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap;}

/* ---------- practice ---------- */
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.mode-card{padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:8px;}
.mode-card:hover{border-color:var(--accent);}
.mode-ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;}
.mode-title{font-weight:700;font-size:15px;}
.mode-desc{font-size:12.5px;color:var(--ink-muted);line-height:1.45;}
.practice-shell{max-width:600px;margin:0 auto;}
.practice-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.score-pill{font-family:var(--font-mono);font-size:13px;color:var(--ink-muted);}
.mc-options{display:grid;gap:10px;margin-top:22px;}
.mc-opt{
  text-align:left;padding:14px 16px;border-radius:var(--radius-s);border:1px solid var(--border);background:var(--surface);
  cursor:pointer;font-size:15px;font-weight:600;
}
.mc-opt:hover{background:var(--surface-2);}
.mc-opt.correct{background:var(--success-soft);border-color:var(--success);color:var(--success);}
.mc-opt.wrong{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
.type-input{
  width:100%;padding:14px 16px;border-radius:var(--radius-s);border:1px solid var(--border);background:var(--surface);
  color:var(--ink);font-size:17px;font-family:var(--font-mono);margin-top:16px;
}
.type-input:focus{outline:2px solid var(--accent);}
.type-input.correct{border-color:var(--success);}
.type-input.wrong{border-color:var(--danger);}
.feedback-row{margin-top:14px;font-size:14px;min-height:22px;}
.feedback-row.correct{color:var(--success);}
.feedback-row.wrong{color:var(--danger);}
.mic-row{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:20px;}
.mic-btn{
  width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.mic-btn.listening{animation:pulse 1s infinite;background:var(--danger);}
.heard-text{font-family:var(--font-mono);font-size:14px;color:var(--ink-muted);min-height:20px;}

/* ---------- stats ---------- */
.donut-wrap{display:flex;align-items:center;gap:24px;}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px;}
.legend-item{display:flex;align-items:center;gap:8px;}
.legend-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px;}
.heat-cell{width:12px;height:12px;border-radius:3px;background:var(--surface-2);}

/* ---------- settings ---------- */
.field-group{margin-bottom:24px;}
.field-label{font-weight:700;font-size:14px;margin-bottom:6px;}
.field-hint{font-size:12.5px;color:var(--ink-muted);margin-bottom:10px;}
.slider-row{display:flex;align-items:center;gap:14px;}
input[type=range]{flex:1;accent-color:var(--accent);}
.range-val{font-family:var(--font-mono);font-weight:600;width:32px;text-align:right;}
.check-grid{display:flex;flex-wrap:wrap;gap:8px;}
.check-chip{padding:8px 13px;border-radius:99px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-muted);}
.check-chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);gap:14px;}
.settings-row:last-child{border-bottom:none;}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

@media (max-width:880px){
  .sidebar{display:none;}
  .view{padding:20px 16px 90px;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .cta-row{grid-template-columns:1fr;}
  .two-col{grid-template-columns:1fr;}
  .mode-grid{grid-template-columns:1fr 1fr;}
  .tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface-3);border-top:1px solid var(--border);
    justify-content:space-around;padding:6px 4px 8px;z-index:40;
  }
  .tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--ink-muted);font-size:10.5px;font-weight:700;padding:6px 4px;flex:1;}
  .tab-item.active{color:var(--accent);}
  .tab-item .ic{width:20px;height:20px;}
}
@media (max-width:520px){
  .mode-grid{grid-template-columns:1fr;}
  .flash-word{font-size:32px;}
  .grade-row{grid-template-columns:repeat(2,1fr);}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
</style>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main"><div class="view" id="view"></div></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
/*WORDS_START*/

ic":"phrasal-verb","ru":"оставаться безнаказанным за","ipa":"/ɡet/","example_en":"He won't get away with lying to us again.","example_ru":"Ему больше не удастся безнаказанно лгать нам."},{"id":2410,"word":"get over","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"оправиться от; преодолеть","ipa":"/ɡet/","example_en":"It took her months to get over the breakup.","example_ru":"Ей потребовались месяцы, чтобы оправиться после расставания."},{"id":2411,"word":"give up","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"сдаваться; отказываться от","ipa":"/ɡɪv/","example_en":"Don't give up on your dreams.","example_ru":"Не отказывайся от своей мечты."},{"id":2412,"word":"go through","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"пережить (трудности); пройти через","ipa":"/ɡoʊ/","example_en":"She went through a very difficult time last year.","example_ru":"В прошлом году она пережила очень трудный период."},{"id":2413,"word":"hold on","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"подождать; держаться","ipa":"/hoʊld/","example_en":"Hold on a second, I'll be right back.","example_ru":"Подожди секунду, я сейчас вернусь."},{"id":2414,"word":"keep up with","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"не отставать от; идти в ногу с","ipa":"/kiːp/","example_en":"It's hard to keep up with all the new technology.","example_ru":"Трудно поспевать за всеми новыми технологиями."},{"id":2415,"word":"look forward to","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"с нетерпением ждать","ipa":"/lʊk/","example_en":"We are looking forward to seeing you next week.","example_ru":"Мы с нетерпением ждём встречи с тобой на следующей неделе."},{"id":2416,"word":"look into","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"изучать; расследовать","ipa":"/lʊk/","example_en":"The police are looking into the matter.","example_ru":"Полиция расследует это дело."},{"id":2417,"word":"make up for","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"компенсировать; ":"Нам нужно уладить это недоразумение."},{"id":2426,"word":"stand out","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"выделяться","ipa":"/stænd/","example_en":"Her resume stood out among hundreds of applications.","example_ru":"Её резюме выделялось среди сотен заявок."},{"id":2427,"word":"take after","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"быть похожим на (родителя)","ipa":"/teɪk/","example_en":"She takes after her mother in temperament.","example_ru":"По характеру она пошла в мать."},{"id":2428,"word":"take over","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"принимать управление; захватывать","ipa":"/teɪk/","example_en":"His son will take over the family business.","example_ru":"Его сын возьмёт на себя семейный бизнес."},{"id":2429,"word":"turn down","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"отклонять; отказывать","ipa":"/tɜːrn/","example_en":"She turned down the job offer.","example_ru":"Она отклонила предложение о работе."},{"id":2430,"word":"turn out","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"оказаться (в итоге)","ipa":"/tɜːrn/","example_en":"The party turned out to be a lot of fun.","example_ru":"Вечеринка оказалась очень весёлой."},{"id":2431,"word":"work out","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"решаться (о проблеме); заниматься спортом","ipa":"/wɜːrk/","example_en":"I'm sure things will work out in the end.","example_ru":"Я уверен, что в итоге всё образуется."},{"id":2432,"word":"back up","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"поддерживать; создавать резервную копию","ipa":"/bæk/","example_en":"Always back up your files before an update.","example_ru":"Всегда делайте резервную копию файлов перед обновлением."},{"id":2433,"word":"break down","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"ломаться; разбирать (на части)","ipa":"/breɪk/","example_en":"The car broke down on the highway.","example_ru":"Машина сломалась на шоссе."},{"id":2434,"word":"break out","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"вспыхивать (о конфликте, болезни)","ipa":"/breɪk/","example_en":"A fire broke out in the warehouse last night.","example_ru":"Прошлой ночью на складе вспыхнул пожар."},{"id":2435,"word":"bring down","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"свергать; снижать","ipa":"/brɪŋ/","example_en":"The scandal helped bring down the government.","example_ru":"Скандал способствовал свержению правительства."},{"id":2436,"word":"call off","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"отменять","ipa":"/kɔːl/","example_en":"They called off the wedding at the last minute.","example_ru":"В последний момент они отменили свадьбу."},{"id":2437,"word":"carry on","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"продолжать","ipa":"/ˈkæri/","example_en":"Please carry on with your work.","example_ru":"Пожалуйста, продолжайте работать."},{"id":2438,"word":"catch up","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"наверстать упущенное; догнать","ipa":"/kætʃ/","example_en":"I need to catch up on my sleep this weekend.","example_ru":"На этих выходных мне нужно наверстать недосып."},{"id":2439,"word":"come out","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"выходить (о продукте, книге); проясняться","ipa":"/kʌm/","example_en":"Her new novel comes out next month.","example_ru":"Её новый роман выходит в следующем месяце."},{"id":2440,"word":"count on","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"рассчитывать на","ipa":"/kaʊnt/","example_en":"You can always count on your family.","example_ru":"Ты всегда можешь рассчитывать на свою семью."},{"id":2441,"word":"cut off","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"отрезать; прерывать (связь)","ipa":"/kʌt/","example_en":"The storm cut off power to the whole town.","example_ru":"Буря отключила электричество во всём городе."},{"id":2442,"word":"fall behind","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"отставать","ipa":"/fɔːl/","example_en":"He fell behind on his rent payments.","example_ru":"Он стал отставать с оплатой аренды."},{"id":2443,"word":"fall through","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"срываться (о планах)","ipa":"/fɔːl/","example_en":"Our vacation plans fell through at the last minute.","example_ru":"Наши планы на отпуск сорвались в последний момент."},{"id":2444,"word":"get by","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"перебиваться; сводить концы с концами","ipa":"/ɡet/","example_en":"They manage to get by on a small salary.","example_ru":"Им удаётся сводить концы с концами на небольшую зарплату."},{"id":2445,"word":"get through","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"пережить; дозвониться; пройти (испытание)","ipa":"/ɡet/","example_en":"I couldn't get through to him on the phone.","example_ru":"Я не смог дозвониться до него по телефону."},{"id":2446,"word":"hand in","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"сдавать (работу, документ)","ipa":"/hænd/","example_en":"Please hand in your essays by Friday.","example_ru":"Пожалуйста, сдайте сочинения до пятницы."},{"id":2447,"word":"hang out","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"проводить время; тусоваться","ipa":"/hæŋ/","example_en":"We usually hang out at the café after school.","example_ru":"Обычно мы тусуемся в кафе после школы."},{"id":2448,"word":"hold back","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"сдерживать(ся)","ipa":"/hoʊld/","example_en":"She held back her tears during the speech.","example_ru":"Во время речи она сдерживала слёзы."},{"id":2449,"word":"keep on","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"продолжать (делать что-то)","ipa":"/kiːp/","example_en":"He kept on talking even though no one listened.","example_ru":"Он продолжал говорить, хотя его никто не слушал."},{"id":2450,"word":"live up to","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"оправдывать (ожидания)","ipa":"/lɪv/","example_en":"The movie didn't live up to my expectations.","example_ru":"Фильм не оправдал моих ожиданий."},{"id":2451,"word":"look after","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"заботиться о; присматривать за","ipa":"/lʊk/","example_en":"She looks after her younger siblings after school.","example_ru":"После школы она присматривает за младшими братьями и сёстрами."},{"id":2452,"word":"look down on","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"смотреть свысока на; презирать","ipa":"/lʊk/","example_en":"He tends to look down on people less educated than him.","example_ru":"Он склонен смотреть свысока на людей менее образованных, чем он."},{"id":2453,"word":"make out","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"разглядеть; разобрать (с трудом)","ipa":"/meɪk/","example_en":"I could barely make out his handwriting.","example_ru":"Я едва мог разобрать его почерк."},{"id":2454,"word":"move on","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"двигаться дальше (по жизни)","ipa":"/muːv/","example_en":"It's time to move on from the past.","example_ru":"Пора двигаться дальше от прошлого."},{"id":2455,"word":"own up to","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"признаваться в","ipa":"/oʊn/","example_en":"He finally owned up to breaking the window.","example_ru":"Он наконец признался, что разбил окно."},{"id":2456,"word":"point out","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"указывать на; отмечать","ipa":"/pɔɪnt/","example_en":"She pointed out a mistake in the report.","example_ru":"Она указала на ошибку в отчёте."},{"id":2457,"word":"rely on","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"полагаться на","ipa":"/rɪˈlaɪ/","example_en":"We rely on volunteers to run the shelter.","example_ru":"Мы полагаемся на волонтёров в работе приюта."},{"id":2458,"word":"rule out","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"исключать (возможность)","ipa":"/ruːl/","example_en":"Doctors have ruled out any serious illness.","example_ru":"Врачи исключили какое-либо серьёзное заболевание."},{"id":2459,"word":"run into","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"случайно встретить; столкнуться с","ipa":"/rʌn/","example_en":"I ran into an old friend at the airport.","example_ru":"В аэропорту я случайно встретил старого друга."},{"id":2460,"word":"settle down","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"остепениться; успокоиться; обосноваться","ipa":"/ˈsetl/","example_en":"After years of traveling, they decided to settle down.","example_ru":"После многих лет путешествий они решили осесть на одном месте."},{"id":2461,"word":"speak up","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"высказываться; говорить громче","ipa":"/spiːk/","example_en":"You should speak up if something bothers you.","example_ru":"Тебе стоит высказаться, если тебя что-то беспокоит."},{"id":2462,"word":"stick to","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"придерживаться (плана, решения)","ipa":"/stɪk/","example_en":"It's important to stick to your budget.","example_ru":"Важно придерживаться своего бюджета."},{"id":2463,"word":"take on","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"брать на себя (ответственность); нанимать","ipa":"/teɪk/","example_en":"The firm is taking on ten new employees this year.","example_ru":"В этом году фирма нанимает десять новых сотрудников."},{"id":2464,"word":"wear out","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"изнашивать(ся); изматывать","ipa":"/weər/","example_en":"These shoes wore out after just a few months.","example_ru":"Эти туфли износились всего за несколько месяцев."},{"id":2465,"word":"wipe out","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"уничтожать; стирать с лица земли","ipa":"/waɪp/","example_en":"The disease wiped out most of the population.","example_ru":"Болезнь уничтожила большую часть населения."},{"id":2466,"word":"account for","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"объяснять; составлять (долю от целого)","ipa":"/əˈkaʊnt/","example_en":"Exports account for a third of the country's income.","example_ru":"Экспорт составляет треть дохода страны."},{"id":2467,"word":"add up","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"складываться; иметь смысл (сходиться)","ipa":"/æd/","example_en":"Something about his story doesn't add up.","example_ru":"Что-то в его истории не сходится."},{"id":2468,"word":"ask around","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"расспрашивать (разных людей)","ipa":"/æsk/","example_en":"I'll ask around to see if anyone knows a good dentist.","example_ru":"Я поспрашиваю вокруг, знает ли кто хорошего стоматолога."},{"id":2469,"word":"bear with","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"терпеливо ждать; проявить терпение к","ipa":"/beər/","example_en":"Please bear with me while I fix this issue.","example_ru":"Пожалуйста, потерпите, пока я решаю эту проблему."},{"id":2470,"word":"boil down to","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"сводиться к (сути)","ipa":"/bɔɪl/","example_en":"It all boils down to a lack of trust.","example_ru":"Всё сводится к отсутствию доверия."},{"id":2471,"word":"bring forward","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"переносить на более ранний срок","ipa":"/brɪŋ/","example_en":"We had to bring the meeting forward to Monday.","example_ru":"Нам пришлось перенести встречу на более ранний срок, на понедельник."},{"id":2472,"word":"brush up on","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"освежить (знания)","ipa":"/brʌʃ/","example_en":"I need to brush up on my French before the trip.","example_ru":"Мне нужно освежить французский перед поездкой."},{"id":2473,"word":"build up","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"наращивать; накапливать","ipa":"/bɪld/","example_en":"It takes time to build up trust with clients.","example_ru":"Требуется время, чтобы наладить доверие с клиентами."},{"id":2474,"word":"cave in","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"уступать (под давлением); обрушиваться","ipa":"/keɪv/","example_en":"He finally caved in and agreed to their demands.","example_ru":"В конце концов он сдался и согласился на их требования."},{"id":2475,"word":"chip in","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"вносить свою долю (денег, усилий)","ipa":"/tʃɪp/","example_en":"Everyone chipped in to buy her a farewell gift.","example_ru":"Все скинулись, чтобы купить ей прощальный подарок."},{"id":2476,"word":"close down","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"закрываться (о бизнесе)","ipa":"/kloʊz/","example_en":"The factory closed down after fifty years.","example_ru":"Фабрика закрылась после пятидесяти лет работы."},{"id":2477,"word":"come down with","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"заболеть (чем-то)","ipa":"/kʌm/","example_en":"She came down with the flu last week.","example_ru":"На прошлой неделе она заболела гриппом."},{"id":2478,"word":"cross out","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"вычёркивать","ipa":"/krɒs/","example_en":"Cross out any answer that is incorrect.","example_ru":"Вычеркните любой неправильный ответ."},{"id":2479,"word":"dawn on","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"осенить; дойти (о понимании)","ipa":"/dɔːn/","example_en":"It suddenly dawned on me that I had forgotten my keys.","example_ru":"Меня вдруг осенило, что я забыл ключи."},{"id":2480,"word":"die out","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"вымирать; исчезать постепенно","ipa":"/daɪ/","example_en":"Many traditional crafts are dying out.","example_ru":"Многие традиционные ремёсла постепенно исчезают."},{"id":2481,"word":"do without","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"обходиться без","ipa":"/duː/","example_en":"We'll have to do without a car for a while.","example_ru":"Нам придётся какое-то время обходиться без машины."},{"id":2482,"word":"draw up","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"составлять (документ, план)","ipa":"/drɔː/","example_en":"The lawyer drew up a contract for the sale.","example_ru":"Юрист составил договор купли-продажи."},{"id":2483,"word":"ease off","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"ослабевать; снижать интенсивность","ipa":"/iːz/","example_en":"The rain finally began to ease off.","example_ru":"Дождь наконец начал ослабевать."},{"id":2484,"word":"fall for","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"влюбиться в; попасться на удочку","ipa":"/fɔːl/","example_en":"He fell for her the moment they met.","example_ru":"Он влюбился в неё с первой встречи."},{"id":2485,"word":"fill in","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"заполнять (форму); замещать (кого-то)","ipa":"/fɪl/","example_en":"Please fill in the application form carefully.","example_ru":"Пожалуйста, внимательно заполните форму заявки."},{"id":2486,"word":"get across","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"донести (мысль) до кого-то","ipa":"/ɡet/","example_en":"He struggled to get his point across in the meeting.","example_ru":"Ему было трудно донести свою мысль на встрече."},{"id":2487,"word":"give away","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"раздавать; выдавать (секрет)","ipa":"/ɡɪv/","example_en":"Don't give away the ending of the movie.","example_ru":"Не выдавай концовку фильма."},{"id":2488,"word":"hold up","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"задерживать; выдерживать (нагрузку)","ipa":"/hoʊld/","example_en":"Traffic held us up for almost an hour.","example_ru":"Пробка задержала нас почти на час."},{"id":2489,"word":"iron out","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"улаживать (разногласия)","ipa":"/ˈaɪərn/","example_en":"We need to iron out a few details before signing.","example_ru":"Нам нужно уладить пару деталей перед подписанием."},{"id":2490,"word":"let down","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"подводить (кого-то); разочаровывать","ipa":"/let/","example_en":"I promise I won't let you down.","example_ru":"Обещаю, я тебя не подведу."},{"id":2491,"word":"look up to","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"восхищаться; уважать (как пример для подражания)","ipa":"/lʊk/","example_en":"She has always looked up to her older sister.","example_ru":"Она всегда восхищалась своей старшей сестрой."},{"id":2492,"word":"opt out","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"отказаться от участия","ipa":"/ɒpt/","example_en":"You can opt out of the newsletter at any time.","example_ru":"Вы можете отказаться от рассылки в любое время."},{"id":2493,"word":"pay off","pos":"phr","level":"B2","topic":"phrasal-verb","ru":"окупаться; выплачивать (долг полностью)","ipa":"/peɪ/","example_en":"All her hard work finally paid off.","example_ru":"Весь её упорный труд наконец окупился."},{"id":2494,"word":"pin down","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"точно определить; заставить (кого-то) определиться","ipa":"/pɪn/","example_en":"It's hard to pin down exactly what went wrong.","example_ru":"Трудно точно определить, что именно пошло не так."},{"id":2495,"word":"stem from","pos":"phr","level":"C1","topic":"phrasal-verb","ru":"происходить от; быть следствием","ipa":"/stem/","example_en":"Her fear of dogs stems from a childhood incident.","example_ru":"Её страх перед собаками происходит из случая в детстве."},{"id":2496,"word":"nonetheless","pos":"adv","level":"B2","topic":"connector","ru":"тем не менее","ipa":"/ˌnʌnðəˈles/","example_en":"The task was hard; nonetheless, she finished it on time.","example_ru":"Задача была трудной; тем не менее она закончила её вовремя."},{"id":2497,"word":"nevertheless","pos":"adv","level":"B2","topic":"connector","ru":"тем не менее; всё же","ipa":"/ˌnevərðəˈles/","example_en":"It was raining; nevertheless, they went for a walk.","example_ru":"Шёл дождь; тем не менее они пошли гулять."},{"id":2498,"word":"furthermore","pos":"adv","level":"B2","topic":"connector","ru":"более того; кроме того","ipa":"/ˈfɜːrðərmɔːr/","example_en":"The plan is expensive; furthermore, it is unrealistic.","example_ru":"План дорогостоящий; более того, он нереалистичен."},{"id":2499,"word":"moreover","pos":"adv","level":"B2","topic":"connector","ru":"более того; к тому же","ipa":"/mɔːrˈoʊvər/","example_en":"The house is old; moreover, it needs major repairs.","example_ru":"Дом старый; к тому же он нуждается в капитальном ремонте."},{"id":2500,"word":"consequently","pos":"adv","level":"B2","topic":"connector","ru":"следовательно; в результате","ipa":"/ˈkɒnsɪkwəntli/","example_en":"He missed the deadline; consequently, he lost the contract.","example_ru":"Он не уложился в срок; в результате он потерял контракт."},{"id":2501,"word":"subsequently","pos":"adv","level":"C1","topic":"connector","ru":"впоследствии","ipa":"/ˈsʌbsɪkwəntli/","example_en":"The company was fined and subsequently went bankrupt.","example_ru":"Компанию оштрафовали, а впоследствии она обанкротилась."},{"id":2502,"word":"arguably","pos":"adv","level":"C1","topic":"connector","ru":"пожалуй; возможно (с полным основанием можно утверждать)","ipa":"/ˈɑːrɡjuəbli/","example_en":"This is arguably her best novel yet.","example_ru":"Это, пожалуй, её лучший роман на сегодняшний день."},{"id":2503,"word":"presumably","pos":"adv","level":"C1","topic":"connector","ru":"предположительно","ipa":"/prɪˈzuːməbli/","example_en":"He didn't answer, presumably because he was asleep.","example_ru":"Он не ответил, предположительно потому, что спал."},{"id":2504,"word":"inevitably","pos":"adv","level":"B2","topic":"connector","ru":"неизбежно","ipa":"/ɪnˈevɪtəbli/","example_en":"Prices will inevitably rise as demand grows.","example_ru":"Цены неизбежно вырастут по мере роста спроса."},{"id":2505,"word":"undoubtedly","pos":"adv","level":"B2","topic":"connector","ru":"несомненно","ipa":"/ʌnˈdaʊtɪdli/","example_en":"She is undoubtedly the best candidate for the job.","example_ru":"Она, несомненно, лучший кандидат на эту должность."},{"id":2506,"word":"inherently","pos":"adv","level":"C1","topic":"connector","ru":"изначально; по своей природе","ipa":"/ɪnˈhɪərəntli/","example_en":"The process is inherently risky.","example_ru":"Этот процесс изначально сопряжён с риском."},{"id":2507,"word":"predominantly","pos":"adv","level":"C1","topic":"connector","ru":"преимущественно","ipa":"/prɪˈdɒmɪnəntli/","example_en":"The audience was predominantly young professionals.","example_ru":"Аудитория состояла преимущественно из молодых специалистов."},{"id":2508,"word":"considerably","pos":"adv","level":"B2","topic":"connector","ru":"значительно","ipa":"/kənˈsɪdərəbli/","example_en":"Sales have increased considerably this quarter.","example_ru":"В этом квартале продажи значительно выросли."},{"id":2509,"word":"substantially","pos":"adv","level":"B2","topic":"connector","ru":"существенно","ipa":"/səbˈstænʃəli/","example_en":"The new design is substantially different from the old one.","example_ru":"Новый дизайн существенно отличается от старого."},{"id":2510,"word":"marginally","pos":"adv","level":"C1","topic":"connector","ru":"незначительно; в незначительной степени","ipa":"/ˈmɑːrdʒɪnəli/","example_en":"The results were only marginally better than last year.","example_ru":"Результаты были лишь незначительно лучше, чем в прошлом году."},{"id":2511,"word":"deliberately","pos":"adv","level":"B2","topic":"connector","ru":"намеренно; преднамеренно","ipa":"/dɪˈlɪbərətli/","example_en":"He deliberately ignored her calls.","example_ru":"Он намеренно игнорировал её звонки."},{"id":2512,"word":"inadvertently","pos":"adv","level":"C1","topic":"connector","ru":"непреднамеренно; случайно","ipa":"/ˌɪnədˈvɜːrtəntli/","example_en":"She inadvertently deleted the entire file.","example_ru":"Она случайно удалила весь файл."},{"id":2513,"word":"meticulously","pos":"adv","level":"C1","topic":"connector","ru":"тщательно; скрупулёзно","ipa":"/məˈtɪkjələsli/","example_en":"He meticulously recorded every expense.","example_ru":"Он скрупулёзно фиксировал каждый расход."},{"id":2514,"word":"profoundly","pos":"adv","level":"C1","topic":"connector","ru":"глубоко; сильно","ipa":"/prəˈfaʊndli/","example_en":"The experience profoundly changed her outlook on life.","example_ru":"Этот опыт глубоко изменил её взгляд на жизнь."},{"id":2515,"word":"ostensibly","pos":"adv","level":"C1","topic":"connector","ru":"якобы; по-видимому (внешне)","ipa":"/ɒˈstensəbli/","example_en":"He left early, ostensibly to catch a train.","example_ru":"Он ушёл рано, якобы чтобы успеть на поезд."},{"id":2516,"word":"allegedly","pos":"adv","level":"C1","topic":"connector","ru":"предположительно; как утверждается","ipa":"/əˈledʒɪdli/","example_en":"The suspect allegedly stole the car last night.","example_ru":"Подозреваемый, как утверждается, украл машину прошлой ночью."},{"id":2517,"word":"simultaneously","pos":"adv","level":"B2","topic":"connector","ru":"одновременно","ipa":"/ˌsɪmlˈteɪniəsli/","example_en":"She can type and talk on the phone simultaneously.","example_ru":"Она может печатать и разговаривать по телефону одновременно."},{"id":2518,"word":"ultimately","pos":"adv","level":"B2","topic":"connector","ru":"в конечном итоге","ipa":"/ˈʌltɪmətli/","example_en":"Ultimately, the decision is yours to make.","example_ru":"В конечном итоге решение остаётся за тобой."},{"id":2519,"word":"conversely","pos":"adv","level":"C1","topic":"connector","ru":"наоборот; напротив","ipa":"/ˈkɒnvɜːrsli/","example_en":"Prices fell in the city; conversely, they rose in rural areas.","example_ru":"В городе цены упали; напротив, в сельской местности они выросли."},{"id":2520,"word":"correspondingly","pos":"adv","level":"C1","topic":"connector","ru":"соответственно","ipa":"/ˌkɒrɪˈspɒndɪŋli/","example_en":"Demand rose, and prices increased correspondingly.","example_ru":"Спрос вырос, и цены соответственно тоже увеличились."},{"id":2521,"word":"invariably","pos":"adv","level":"C1","topic":"connector","ru":"неизменно; всегда","ipa":"/ɪnˈveəriəbli/","example_en":"He invariably arrives ten minut /* ===== storage ===== */
const LS = {
  progress:'ea.progress.v1', stats:'ea.stats.v1', settings:'ea.settings.v1', starred:'ea.starred.v1'
};
function loadLS(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function saveLS(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

const Store = {
  _progress: loadLS(LS.progress, {}),
  _stats: loadLS(LS.stats, {days:{}}),
  _settings: loadLS(LS.settings, {dailyNewLimit:20, levels:null, topics:null, ttsRate:1}),
  _starred: new Set(loadLS(LS.starred, [])),
  getProgress(){ return this._progress; },
  getWordProgress(id){ return this._progress[id] || null; },
  setWordProgress(id, prog){ this._progress[id] = prog; saveLS(LS.progress, this._progress); queueSync(); },
  resetWordProgress(id){ delete this._progress[id]; saveLS(LS.progress, this._progress); queueSync(); },
  resetAll(){ this._progress = {}; this._stats = {days:{}}; saveLS(LS.progress, this._progress); saveLS(LS.stats, this._stats); queueSync(); },
  getSettings(){ return this._settings; },
  setSettings(patch){ Object.assign(this._settings, patch); saveLS(LS.settings, this._settings); },
  getStats(){ return this._stats; },
  getDay(key){ if(!this._stats.days[key]) this._stats.days[key] = {reviews:0,correct:0,wrong:0,newWords:0}; return this._stats.days[key]; },
  bumpDay(key, patch){
    const d = this.getDay(key);
    for(const k in patch) d[k] = (d[k]||0) + patch[k];
    saveLS(LS.stats, this._stats); queueSync();
  },
  isStarred(id){ return this._starred.has(id); },
  toggleStar(id){ this._starred.has(id) ? this._starred.delete(id) : this._starred.add(id); saveLS(LS.starred, [...this._starred]); queueSync(); },
};

/* ===== cloud sync (best-effort, optional) ===== */
let dbNs = null, syncState = 'off', syncTimer = null;
async function initSync(){
  try{
    if(!window.claude || !window.claude.use) return;
    dbNs = await window.claude.use('db');
    if(!dbNs){ syncState='off'; renderSyncPill(); return; }
    syncState = 'busy'; renderSyncPill();
    const snap = await dbNs.doc('backup/progress').get();
    if(snap.exists){
      const remote = snap.data();
      const localCount = Object.keys(Store._progress).length;
      if(remote && remote.progress && (localCount===0)){
        try{
          Store._progress = JSON.parse(remote.progress);
          Store._stats = remote.stats ? JSON.parse(remote.stats) : Store._stats;
          Store._starred = new Set(remote.starred ? JSON.parse(remote.starred) : []);
          saveLS(LS.progress, Store._progress); saveLS(LS.stats, Store._stats); saveLS(LS.starred,[...Store._starred]);
        }catch(e){}
      }
    }
    syncState='on'; renderSyncPill();
  }catch(e){ syncState='off'; renderSyncPill(); }
}
function queueSync(){
  if(!dbNs) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(doSync, 2500);
}
async function doSync(){
  if(!dbNs) return;
  syncState='busy'; renderSyncPill();
  try{
    await dbNs.doc('backup/progress').set({
      progress: JSON.stringify(Store._progress),
      stats: JSON.stringify(Store._stats),
      starred: JSON.stringify([...Store._starred]),
      updatedAt: new Date().toISOString()
    });
    syncState='on';
  }catch(e){ syncState='off'; }
  renderSyncPill();
}
function renderSyncPill(){
  const el = document.getElementById('sync-pill');
  if(!el) return;
  const label = syncState==='on' ? 'Синхронизировано' : syncState==='busy' ? 'Синхронизация…' : 'Локально';
  el.innerHTML = '<span class="sync-dot '+(syncState==='on'?'on':syncState==='busy'?'busy':'')+'"></span>'+label;
}

/* ===== date/format helpers ===== */
function fmtDateKey(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+day; }
function todayKey(){ return fmtDateKey(new Date()); }
function formatInterval(ms){
  if(ms < 3600*1000) return Math.max(1,Math.round(ms/60000))+' мин';
  if(ms < 86400*1000) return Math.round(ms/3600000)+' ч';
  const days = Math.round(ms/86400000);
  if(days < 60) return days+' дн';
  if(days < 365) return Math.round(days/30)+' мес';
  return (days/365).toFixed(1)+' г';
}
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function highlightWord(sentence, word){
  try{
    const re = new RegExp('\\b('+escapeRegex(word)+')\\b','ig');
    return sentence.replace(re,'<mark>$1</mark>');
  }catch(e){ return sentence; }
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===== SRS engine (SM-2 style with short learning steps) ===== */
const LEARN_STEPS_MIN = [1, 10];
function reviewWord(prog, grade){
  const now = Date.now();
  const p = prog ? Object.assign({}, prog) : {ef:2.5, ivl:0, reps:0, stage:'learning', step:0, due:now, last:now, correct:0, wrong:0, lapses:0};
  if(grade==='again'){
    p.stage='learning'; p.step=0; p.reps=0; p.lapses++; p.wrong++;
    p.ef = Math.max(1.3, p.ef-0.2);
    p.due = now + LEARN_STEPS_MIN[0]*60000;
  } else {
    p.correct++;
    if(p.stage==='learning'){
      if(grade==='hard'){
        p.due = now + Math.round(LEARN_STEPS_MIN[Math.min(p.step,LEARN_STEPS_MIN.length-1)]*1.6)*60000;
      } else {
        p.step++;
        if(p.step >= LEARN_STEPS_MIN.length){
          p.stage='review'; p.reps=1; p.ivl = grade==='easy' ? 4 : 1;
          p.due = now + p.ivl*86400000;
        } else {
          p.due = now + LEARN_STEPS_MIN[p.step]*60000;
        }
      }
    } else {
      if(grade==='hard'){ p.ef=Math.max(1.3,p.ef-0.15); p.ivl=Math.max(1,Math.round(p.ivl*1.2)); }
      else if(grade==='good'){ p.ivl=Math.max(1,Math.round(p.ivl*p.ef)); }
      else { p.ef=p.ef+0.15; p.ivl=Math.max(1,Math.round(p.ivl*p.ef*1.3)); }
      p.reps++;
      p.due = now + p.ivl*86400000;
    }
  }
  p.last = now;
  return p;
}
function statusOf(id){
  const p = Store.getWordProgress(id);
  if(!p) return 'new';
  if(p.stage==='learning') return 'learning';
  if(p.ivl >= 21) return 'mastered';
  return 'review';
}
function matchesFilters(w, settings){
  if(settings.levels && settings.levels.length && !settings.levels.includes(w.level)) return false;
  if(settings.topics && settings.topics.length && !settings.topics.includes(w.topic)) return false;
  return true;
}

}

function dueCount(){
  const now = Date.now(); const p = Store.getProgress();
  return WORDS.filter(w=>p[w.id] && p[w.id].due<=now).length;
}
function newAvailableCount(){
  const settings = Store.getSettings(); const p = Store.getProgress();
  const day = Store.getDay(todayKey());
  const remaining = Math.max(0, (settings.dailyNewLimit||20) - (day.newWords||0));
  const pool = WORDS.filter(w=>!p[w.id] && matchesFilters(w,settings));
  return Math.min(remaining, pool.length);
}

const MONTHS_RU = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function todayLabelRu(){ const d=new Date(); return d.getDate()+' '+MONTHS_RU[d.getMonth()]+' '+d.getFullYear(); }
function wordOfDay(){
  const start = new Date(new Date().getFullYear(),0,0);
  const dayOfYear = Math.floor((new Date()-start)/86400000);
  return WORDS[dayOfYear % WORDS.length];
}
function playWord(id){ const w=WORDS_BY_ID[id]; if(w) speak(w.word); }
function playExample(id){ const w=WORDS_BY_ID[id]; if(w) speak(w.example_en); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function overallCounts(){
  const counts = {new:0, learning:0, review:0, mastered:0};
  WORDS.forEach(w=>{ counts[statusOf(w.id)]++; });
  return counts;
}
function levelStats(){
  return LEVELS.map(lv=>{
    const words = WORDS.filter(w=>w.level===lv);
    const learned = words.filter(w=>Store.getWordProgress(w.id)).length;
    return {level:lv, total:words.length, learned};
  });
}
function last14Days(){
  const stats = Store.getStats(); const out=[];
  for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const key=fmtDateKey(d); out.push({key,date:d,reviews:(stats.days[key]&&stats.days[key].reviews)||0}); }
  return out;
}
function computeStreak(){
  const stats = Store.getStats();
  const hasToday = !!(stats.days[todayKey()] && stats.days[todayKey()].reviews>0);
  let d = new Date();
  if(!hasToday) d.setDate(d.getDate()-1);
  let streak=0;
  while(true){ const key=fmtDateKey(d); if(stats.days[key] && stats.days[key].reviews>0){ streak++; d.setDate(d.getDate()-1); } else break; }
  return streak;
}
function activityChartSvg(days, maxRev){
  const w=680,h=120,pad=22, gap=(w-2*pad)/days.length, bw=gap*0.6;
  let bars='';
  days.forEach((d,i)=>{
    const x = pad + i*gap + (gap-bw)/2;
    const bh = maxRev ? (d.reviews/maxRev)*(h-2*pad) : 0;
    const y = h-pad-Math.max(bh, d.reviews>0?4:0);
    bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(2,bh).toFixed(1)+'" rx="3" style="fill:'+(d.reviews>0?'var(--accent)':'var(--surface-2)')+'"><title>'+d.date.getDate()+'.'+(d.date.getMonth()+1)+': '+d.reviews+'</title></rect>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:120px;overflow:visible">'+bars+'<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" style="stroke:var(--border)" stroke-width="1"/></svg>';
}

/* ===== session ===== */
function buildQueue(mode){
  const settings = Store.getSettings();
  const p = Store.getProgress();
  const now = Date.now();
  const duePool = WORDS.filter(w=>p[w.id] && p[w.id].due<=now && matchesFilters(w,settings))
    .sort((a,b)=>p[a.id].due-p[b.id].due).map(w=>w.id);
  const day = Store.getDay(todayKey());
  const remaining = Math.max(0,(settings.dailyNewLimit||20)-(day.newWords||0));
  const newPool = WORDS.filter(w=>!p[w.id] && matchesFilters(w,settings)).sort((a,b)=>a.id-b.id).slice(0,remaining).map(w=>w.id);
  if(mode==='review') return duePool;
  if(mode==='learn') return newPool;
  const combined = []; let di=0, ni=0;
  while(di<duePool.length || ni<newPool.length){
    for(let k=0;k<4 && di<duePool.length;k++) combined.push(duePool[di++]);
    if(ni<newPool.length) combined.push(newPool[ni++]);
  }
  return combined;
}
function startSession(mode){
  state.sessionMode = mode;
  state.sessionQueue = buildQueue(mode);
  state.sessionTotal = state.sessionQueue.length;
  state.sessionPos = 0; state.flipped=false;
  location.hash = 'session/'+mode;
}

function gradeRowHtml(wid,isNew){
  const prog = Store.getWordProgress(wid);
  const grades = isNew ? ['again','good','easy'] : ['again','hard','good','easy'];
  const labels = {again:'Забыл',hard:'Трудно',good:'Хорошо',easy:'Легко'};
  return '<div class="grade-row" style="grid-template-columns:repeat('+grades.length+',1fr)">'+
    grades.map(g=>{
      const preview = reviewWord(prog,g);
      const delta = preview.due - Date.now();
      return '<button class="grade-btn '+g+'" onclick="gradeCard(\''+g+'\')">'+labels[g]+'<small>'+formatInterval(delta)+'</small></button>';
    }).join('')+'</div>';
}
function gradeCard(grade){
  const wid = state.sessionQueue[0];
  const prog = Store.getWordProgress(wid);
  const wasNew = !prog;
  Store.setWordProgress(wid, reviewWord(prog,grade));
  Store.bumpDay(todayKey(), {reviews:1, correct: grade!=='again'?1:0, wrong: grade==='again'?1:0, newWords: wasNew?1:0});
  state.sessionQueue.shift();
  if(grade==='again'){
    state.sessionQueue.splice(Math.min(state.sessionQueue.length,3),0,wid);
    state.sessionTotal++;
  }
  state.flipped=false;
  route();
}

function buildPracticePool(){
  const p = Store.getProgress();
  let pool = WORDS.filter(w=>p[w.id]).map(w=>w.id);
  if(pool.length<10){
    const extra = shuffle(WORDS.slice(0,300).map(w=>w.id).filter(id=>!pool.includes(id)));
    pool = pool.concat(extra.slice(0,10-pool.length));
  }
  return shuffle(pool).slice(0,20);
}

let currentMcOptions = [];
function mcOptions(w){
  const correctText = w.ru.split(';')[0].trim();
  let pool = WORDS.filter(x=>x.id!==w.id && x.topic===w.topic);
  if(pool.length<3) pool = WORDS.filter(x=>x.id!==w.id && x.level===w.level);
  if(pool.length<3) pool = WORDS.filter(x=>x.id!==w.id);
  const distractors = shuffle(pool).slice(0,3).map(d=>({text:d.ru.split(';')[0].trim(), correct:false}));
  return shuffle([{text:correctText, correct:true}, ...distractors]);
}

  const w = currentPracticeWord();

  const btn = document.getElementById('mic-btn'); const heard = document.getElementById('heard-text');
  btn.classList.add('listening'); heard.textContent='Слушаю…';
  rec.onresult = (e)=>{

    const target = normalizeAnswer(w.word);
    const correct = alts.some(t=>t===target || t.includes(target));
    heard.textContent = 'Услышано: «'+e.results[0][0].transcript+'»'+(correct?' ✓':' — попробуй ещё раз');

function heatmapDays(n){
  const stats = Store.getStats(); const out=[];
  for(let i=n-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const key=fmtDateKey(d); out.push({key, reviews:(stats.days[key]&&stats.days[key].reviews)||0}); }
  return out;
}
function heatColor(n){
  if(n<=0) return 'var(--surface-2)';
  if(n<5) return 'var(--accent-soft)';
  if(n<15) return 'color-mix(in srgb, var(--accent) 55%, var(--surface-2))';
  return 'var(--accent)';
}
function donutSvg(counts){
  const total = counts.new+counts.learning+counts.review+counts.mastered || 1;
  const segs = [{v:counts.mastered,color:'var(--success)'},{v:counts.review,color:'var(--accent)'},{v:counts.learning,color:'var(--warn)'},{v:counts.new,color:'var(--border)'}];
  const r=54, cx=64, cy=64, circumf=2*Math.PI*r; let offset=0;
  const arcs = segs.map(s=>{
    const len = (s.v/total)*circumf;
    const el = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" style="stroke:'+s.color+'" stroke-width="16" stroke-dasharray="'+len.toFixed(1)+' '+(circumf-len).toFixed(1)+'" stroke-dashoffset="'+(-offset).toFixed(1)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    offset += len; return el;
  }).join('');
  const legend = '<div class="legend">'+
    '<div class="legend-item"><span class="legend-dot" style="background:var(--success)"></span>Освоено: '+counts.mastered+'</div>'+
    '<div class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span>Повторение: '+counts.review+'</div>'+
    '<div class="legend-item"><span class="legend-dot" style="background:var(--warn)"></span>Учится: '+counts.learning+'</div>'+
    '<div class="legend-item"><span class="legend-dot" style="background:var(--border)"></span>Новое: '+counts.new+'</div></div>';
  return '<div class="donut-wrap"><svg viewBox="0 0 128 128" width="128" height="128">'+arcs+'</svg>'+legend+'</div>';
}

function splitDelim(line, delim){
  if(delim!==','){ return line.split(delim); }
  const res=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){ inQ=!inQ; continue; }
    if(c===',' && !inQ){ res.push(cur); cur=''; continue; }
    cur+=c;
  }
  res.push(cur); return res;
}
function stripHtml(s){
  return String(s).replace(/<br\s*\/?>/gi,'; ').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').trim();
}
function parseImportText(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length && !l.trim().startsWith('#'));
  if(!lines.length) return [];
  const sample = lines[0];
  const delim = sample.includes('\t') ? '\t' : (sample.split(';').length>sample.split(',').length ? ';' : ',');
  const out = [];
  for(const line of lines){
    const cols = splitDelim(line, delim).map(stripHtml);
    if(!cols[0]) continue;
    const level = (cols[6]||'').toUpperCase().trim();
    out.push({
      word: cols[0],
      ru: cols[1] || '—',
      example_en: cols[2] || '',
      example_ru: cols[3] || '',
      ipa: cols[4] || '',
      pos: (cols[5]||'').trim() || 'n',
      level: LEVELS.includes(level) ? level : 'B1',
      topic: 'custom'
    });
  }
  return out.filter(w=>w.word);
}
function handleImportDeck(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = parseImportText(String(reader.result));
      if(!parsed.length){ toast('Не нашёл слов в файле — проверь формат'); return; }
      let nextId = Math.max(0, ...WORDS.map(w=>w.id)) + 1;
      const existing = new Set(WORDS.map(w=>w.word.toLowerCase()));
      const added = [];
      parsed.forEach(w=>{
        if(existing.has(w.word.toLowerCase())) return;
        existing.add(w.word.toLowerCase());
        added.push(Object.assign({id: nextId++}, w));
      });
      CUSTOM_WORDS = CUSTOM_WORDS.concat(added);
      saveLS('ea.customWords.v1', CUSTOM_WORDS);
      WORDS = BASE_WORDS.concat(CUSTOM_WORDS);
      rebuildWordIndex();
      toast('Добавлено новых слов: '+added.length+(added.length<parsed.length?' (пропущено дублей: '+(parsed.length-added.length)+')':''));
      route();
    }catch(e){ toast('Не удалось разобрать файл'); }
  };
  reader.readAsText(file);
}

  CUSTOM_WORDS = [];

          '<input type="file" id="import-deck-file" accept=".txt,.csv,.tsv,text/plain,text/csv" style="display:none" onchange="handleImportDeck(this.files[0])">'+
        '</div></div>'+
      '<div class="settings-row"><div><div style="font-weight:700;font-size:14px;">Облачная синхронизация</div><div class="field-hint" style="margin:2px 0 0" id="sync-status-text">—</div></div>'+
        '<button class="btn btn-outline btn-sm" onclick="doSync()">Синхронизировать</button></div>'+
      '<div class="settings-row" id="reset-row"><div><div style="font-weight:700;font-size:14px;color:var(--danger)">Сбросить весь прогресс</div><div class="field-hint" style="margin:2px 0 0">Все карточки станут новыми. Статистика обнулится.</div></div>'+
        '<button class="btn btn-danger btn-sm" onclick="confirmResetAll()">Сбросить</button></div>'+
    '</div>';
  document.getElementById('new-limit-range').addEventListener('input', e=>{ document.getElementById('new-limit-val').textContent=e.target.value; });
  document.getElementById('new-limit-range').addEventListener('change', e=>{ Store.setSettings({dailyNewLimit:parseInt(e.target.value,10)}); toast('Сохранено'); });
  document.getElementById('tts-rate-range').addEventListener('input', e=>{ document.getElementById('tts-rate-val').textContent=parseFloat(e.target.value).toFixed(1)+'×'; });
  document.getElementById('tts-rate-range').addEventListener('change', e=>{ Store.setSettings({ttsRate:parseFloat(e.target.value)}); });
  const st = document.getElementById('sync-status-text');
  if(st) st.textContent = dbNs ? (syncState==='on' ? 'Прогресс сохраняется в облаке — открывай с любого устройства.' : 'Подключение к облаку…') : 'Доступно только локально в этом браузере.';
}

/* ===== boot ===== */
document.addEventListener('keydown', (e)=>{
  if(currentViewId()!=='session') return;
  if(document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); if(!state.flipped){ const wid=state.sessionQueue[0]; if(wid && Store.getWordProgress(wid)) flipCard(); } return; }
  const wid = state.sessionQueue[0]; if(!wid) return;
  const isNew = !Store.getWordProgress(wid);
  if(state.flipped || isNew){
    const map = isNew ? {'1':'again','2':'good','3':'easy'} : {'1':'again','2':'hard','3':'good','4':'easy'};
    if(map[e.key]) gradeCard(map[e.key]);
  }
});
route();
initSync();
</script>

services:
  app_postgres:
    image: postgres:16-alpine
    container_name: app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-appuser}
      POSTGRES_DB: postgres
    ports:
      - "5544:5432"
    volumes:
      - lexi_pg_data:/var/lib/postgresql/data
      - ./docker/init-lexi-db.sh:/docker-entrypoint-initdb.d/init-lexi-db.sh:ro

  lexi_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexi_api_local
    restart: unless-stopped
    depends_on:
      - app_postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Host=app_postgres;Port=5432;Database=lexi_english;Username=lexi_user;Password=lexi_user"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-locally}
    ports:
      - "8080:80"

volumes:
  lexi_pg_data:
